# Core Kernel Configuration
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Console Setup
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Bluetooth Host
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EFR32_M33_QEMU"

# HCI UART Transport Driver
CONFIG_BT_HCI=y
CONFIG_BT_DRIVERS=y
CONFIG_BT_H4=y
# Require UART Driver with Interrupt Support
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_BT_DEBUG_MONITOR_UART=y
CONFIG_UART_CONSOLE=n
